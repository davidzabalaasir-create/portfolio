<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="David Zabala — Administración de Sistemas Informáticos en Red">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#62d9df" stroke-opacity=".08"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="20%" r="60%">
      <stop offset="0" stop-color="#62d9df" stop-opacity=".22"/>
      <stop offset="1" stop-color="#62d9df" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62d9df"/>
      <stop offset="1" stop-color="#62d9df" stop-opacity=".15"/>
    </linearGradient>
    <style>
      .mono{font-family:'DM Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .sans{font-family:'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif}
      .type{animation:type 3.2s steps(34) .4s both}
      @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
      .b{animation:b 2.4s ease-in-out infinite alternate;transform-origin:bottom;transform-box:fill-box}
      @keyframes b{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
      .fade{animation:fade 1s ease 3.4s both}
      @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    </style>
  </defs>

  <rect width="1200" height="380" rx="24" fill="#08101d"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="379" rx="23.5" fill="none" stroke="#97b0ba" stroke-opacity=".2"/>

  <!-- Texto -->
  <text x="64" y="84" class="mono" font-size="15" fill="#9bb0b6" letter-spacing="2"><tspan fill="#d2ff52">01</tspan> / administración de sistemas informáticos en red</text>
  <text x="62" y="168" class="sans" font-size="72" font-weight="700" fill="#e7f1ee" letter-spacing="-3">David Zabala</text>
  <text x="62" y="236" class="sans" font-size="54" font-weight="600" fill="#d2ff52" letter-spacing="-2">Diseño sistemas que resisten.</text>

  <g class="mono" font-size="18">
    <text x="64" y="300" fill="#62d9df">$</text>
    <text x="86" y="300" fill="#e7f1ee" class="type">sudo systemctl start curiosidad.service</text>
    <rect x="510" y="285" width="10" height="19" fill="#d2ff52" class="cur"/>
  </g>
  <g class="mono fade" font-size="14" fill="#9bb0b6">
    <circle cx="70" cy="335" r="5" fill="#d2ff52"/>
    <circle cx="70" cy="335" r="5" fill="#d2ff52" class="pulse"/>
    <text x="86" y="340">active (running) · bilbao, es · disponible para prácticas</text>
  </g>

  <!-- Consola -->
  <g transform="translate(820 70)">
    <rect width="320" height="240" rx="16" fill="#0d1623" stroke="#97b0ba" stroke-opacity=".25"/>
    <path d="M16 0H304A16 16 0 0 1 320 16V42H0V16A16 16 0 0 1 16 0Z" fill="#101d2c"/>
    <circle cx="22" cy="21" r="5" fill="#ff6b6b"/><circle cx="40" cy="21" r="5" fill="#ffb547"/><circle cx="58" cy="21" r="5" fill="#d2ff52"/>
    <text x="300" y="26" text-anchor="end" class="mono" font-size="11" fill="#9bb0b6">uptime.log</text>
    <g class="mono" font-size="12">
      <text x="20" y="72" fill="#62d9df">$ <tspan fill="#e7f1ee">whoami</tspan></text>
      <text x="32" y="92" fill="#9bb0b6">david / asir-admin</text>
      <text x="20" y="118" fill="#62d9df">$ <tspan fill="#e7f1ee">cat foco.txt</tspan></text>
      <text x="32" y="138" fill="#9bb0b6">redes · sistemas · seguridad</text>
    </g>
    <g transform="translate(20 160)">
      <line x1="0" y1="0" x2="280" y2="0" stroke="#97b0ba" stroke-opacity=".2"/>
      <g fill="url(#bar)">
        <rect class="b" x="4"   y="34" width="24" height="30" rx="5" style="animation-delay:0s"/>
        <rect class="b" x="40"  y="22" width="24" height="42" rx="5" style="animation-delay:.2s"/>
        <rect class="b" x="76"  y="28" width="24" height="36" rx="5" style="animation-delay:.4s"/>
        <rect class="b" x="112" y="14" width="24" height="50" rx="5" style="animation-delay:.6s"/>
        <rect class="b" x="148" y="6"  width="24" height="58" rx="5" style="animation-delay:.8s"/>
        <rect class="b" x="184" y="20" width="24" height="44" rx="5" style="animation-delay:1s"/>
        <rect class="b" x="220" y="12" width="24" height="52" rx="5" style="animation-delay:1.2s"/>
        <rect class="b" x="256" y="24" width="24" height="40" rx="5" style="animation-delay:1.4s"/>
      </g>
    </g>
  </g>
</svg>
