<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Topología del laboratorio: Internet, firewall pfSense y VLAN de administración, servidores y usuarios con sensor Suricata">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#62d9df" stroke-opacity=".06"/></pattern>
    <style>
      .mono{font-family:'DM Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .sans{font-family:'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif}
      .link{fill:none;stroke:#97b0ba;stroke-opacity:.35;stroke-width:2}
      .flow{fill:none;stroke-width:2.5;stroke-dasharray:4 14;animation:flow 1s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-18}}
      .scan{animation:scan 2.6s ease-in-out infinite}
      @keyframes scan{0%,100%{opacity:.25}50%{opacity:1}}
      .alert{animation:alert 3s ease-in-out infinite}
      @keyframes alert{0%,70%,100%{opacity:0}75%,90%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#08101d"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="519" rx="23.5" fill="none" stroke="#97b0ba" stroke-opacity=".2"/>
  <text x="48" y="54" class="mono" font-size="14" fill="#9bb0b6" letter-spacing="2"><tspan fill="#d2ff52">~/</tspan>laboratorio-lan — topología</text>

  <!-- enlaces -->
  <path class="link" d="M600 118V170"/>
  <path class="link" d="M600 230V270M600 270H230V320M600 270V320M600 270H970V320"/>
  <path class="flow" stroke="#d2ff52" d="M600 118V170"/>
  <path class="flow" stroke="#62d9df" d="M600 230V270H230V320"/>
  <path class="flow" stroke="#62d9df" d="M600 270V320" style="animation-delay:.3s"/>
  <path class="flow" stroke="#62d9df" d="M600 270H970V320" style="animation-delay:.6s"/>

  <!-- Internet -->
  <g transform="translate(600 92)">
    <path d="M-40 14a18 18 0 0 1 4-35 26 26 0 0 1 48-6 20 20 0 0 1 28 23 14 14 0 0 1-4 18Z" fill="#101d2c" stroke="#97b0ba" stroke-opacity=".4"/>
    <text y="4" text-anchor="middle" class="mono" font-size="12" fill="#e7f1ee">WAN</text>
  </g>

  <!-- Firewall -->
  <g transform="translate(480 170)">
    <rect width="240" height="60" rx="14" fill="#0d1623" stroke="#d2ff52" stroke-opacity=".7"/>
    <g fill="#d2ff52" opacity=".85">
      <rect x="18" y="16" width="12" height="7" rx="1.5"/><rect x="32" y="16" width="12" height="7" rx="1.5"/>
      <rect x="11" y="26" width="12" height="7" rx="1.5"/><rect x="25" y="26" width="12" height="7" rx="1.5"/><rect x="39" y="26" width="12" height="7" rx="1.5"/>
      <rect x="18" y="36" width="12" height="7" rx="1.5"/><rect x="32" y="36" width="12" height="7" rx="1.5"/>
    </g>
    <text x="64" y="28" class="sans" font-size="17" font-weight="600" fill="#e7f1ee">pfSense</text>
    <text x="64" y="46" class="mono" font-size="11" fill="#9bb0b6">firewall · NAT · DHCP</text>
  </g>

  <!-- Suricata -->
  <g transform="translate(770 170)">
    <rect width="190" height="60" rx="14" fill="#0d1623" stroke="#ff6b6b" stroke-opacity=".55" stroke-dasharray="5 5"/>
    <circle cx="28" cy="30" r="12" fill="none" stroke="#ff6b6b" stroke-width="2" class="scan"/>
    <circle cx="28" cy="30" r="4" fill="#ff6b6b"/>
    <text x="52" y="28" class="sans" font-size="16" font-weight="600" fill="#e7f1ee">Suricata</text>
    <text x="52" y="46" class="mono" font-size="11" fill="#9bb0b6">IDS · eve.json</text>
    <g class="alert"><rect x="120" y="-22" width="70" height="20" rx="6" fill="#ff6b6b"/><text x="155" y="-8" text-anchor="middle" class="mono" font-size="10" fill="#08101d">ALERT</text></g>
  </g>
  <path d="M720 200H770" fill="none" stroke="#ff6b6b" stroke-opacity=".5" stroke-dasharray="3 5"/>

  <!-- VLANs -->
  <g class="sans">
    <g transform="translate(110 320)">
      <rect width="240" height="150" rx="18" fill="#0d1623" stroke="#62d9df" stroke-opacity=".4"/>
      <text x="22" y="34" class="mono" font-size="12" fill="#62d9df">VLAN 10 · 10.0.10.0/24</text>
      <text x="22" y="66" font-size="20" font-weight="600" fill="#e7f1ee">Administración</text>
      <text x="22" y="94" class="mono" font-size="12" fill="#9bb0b6">ssh · bastion · git</text>
      <text x="22" y="120" class="mono" font-size="12" fill="#9bb0b6">acceso por rol</text>
    </g>
    <g transform="translate(480 320)">
      <rect width="240" height="150" rx="18" fill="#0d1623" stroke="#62d9df" stroke-opacity=".4"/>
      <text x="22" y="34" class="mono" font-size="12" fill="#62d9df">VLAN 20 · 10.0.20.0/24</text>
      <text x="22" y="66" font-size="20" font-weight="600" fill="#e7f1ee">Servidores</text>
      <text x="22" y="94" class="mono" font-size="12" fill="#9bb0b6">docker · grafana</text>
      <text x="22" y="120" class="mono" font-size="12" fill="#9bb0b6">backups 3-2-1</text>
    </g>
    <g transform="translate(850 320)">
      <rect width="240" height="150" rx="18" fill="#0d1623" stroke="#62d9df" stroke-opacity=".4"/>
      <text x="22" y="34" class="mono" font-size="12" fill="#62d9df">VLAN 30 · 10.0.30.0/24</text>
      <text x="22" y="66" font-size="20" font-weight="600" fill="#e7f1ee">Usuarios</text>
      <text x="22" y="94" class="mono" font-size="12" fill="#9bb0b6">dhcp · dns interno</text>
      <text x="22" y="120" class="mono" font-size="12" fill="#9bb0b6">sin acceso a VLAN 10</text>
    </g>
  </g>
</svg>
