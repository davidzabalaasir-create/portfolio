<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Itinerario formativo: SMR (2023–2025) y ASIR (2025–actualidad)">
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="360" y1="0" x2="840" y2="0">
      <stop offset="0" stop-color="#62d9df"/><stop offset="1" stop-color="#d2ff52"/>
    </linearGradient>
    <style>
      .mono{font-family:'DM Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .sans{font-family:'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif}
      .flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-16}}
      .pkt{animation:pkt 4s ease-in-out infinite}
      @keyframes pkt{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(460px);opacity:0}}
      .pulse{animation:pulse 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#08101d"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="23.5" fill="none" stroke="#97b0ba" stroke-opacity=".2"/>
  <text x="48" y="54" class="mono" font-size="14" fill="#9bb0b6" letter-spacing="2"><tspan fill="#d2ff52">~/</tspan>formación — traceroute</text>

  <!-- Enlace -->
  <line x1="300" y1="150" x2="900" y2="150" stroke="url(#line)" stroke-width="3" class="flow"/>
  <circle cx="370" cy="150" r="6" fill="#d2ff52" class="pkt"/>

  <!-- SMR -->
  <g transform="translate(60 92)">
    <rect width="300" height="150" rx="18" fill="#0d1623" stroke="#62d9df" stroke-opacity=".45"/>
    <text x="24" y="38" class="mono" font-size="13" fill="#62d9df">hop 1 · 2023 — 2025</text>
    <text x="24" y="78" class="sans" font-size="40" font-weight="700" fill="#e7f1ee">SMR</text>
    <text x="24" y="106" class="sans" font-size="15" fill="#9bb0b6">Sistemas Microinformáticos y Redes</text>
    <text x="24" y="130" class="mono" font-size="12" fill="#9bb0b6">✓ completado · Mikeldi</text>
  </g>

  <!-- Router central -->
  <g transform="translate(600 150)">
    <circle r="34" fill="#101d2c" stroke="#97b0ba" stroke-opacity=".35"/>
    <path d="M-14 -6h22l-6-6M14 6h-22l6 6" fill="none" stroke="#62d9df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="62" text-anchor="middle" class="mono" font-size="12" fill="#9bb0b6">upgrade()</text>
  </g>

  <!-- ASIR -->
  <g transform="translate(840 92)">
    <rect width="300" height="150" rx="18" fill="#0d1623" stroke="#d2ff52" stroke-opacity=".6"/>
    <text x="24" y="38" class="mono" font-size="13" fill="#d2ff52">hop 2 · 2025 — hoy</text>
    <text x="24" y="78" class="sans" font-size="40" font-weight="700" fill="#e7f1ee">ASIR</text>
    <text x="24" y="106" class="sans" font-size="15" fill="#9bb0b6">Administración de Sistemas</text>
    <text x="24" y="124" class="sans" font-size="15" fill="#9bb0b6">Informáticos en Red</text>
    <circle cx="268" cy="34" r="5" fill="#d2ff52"/><circle cx="268" cy="34" r="5" fill="#d2ff52" class="pulse"/>
  </g>
</svg>
